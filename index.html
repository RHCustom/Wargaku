<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d8b5e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="WARGAKU"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>WARGAKU</title>
<style>
:root{--bg:#e4f3e8;--card:#f6fcf7;--tx:#1f3326;--mut:#5d7a66;--pri:#3d8b5e;--on:#fff;--pri2:#d2ecd9;--bd:#bfe0c8;--edge:#2c6a46;--edge2:#b5d8bf;--sh:rgba(44,106,70,.28);--hl:rgba(255,255,255,.85);--red:#c0392b;--amb:#b7791f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121813;--card:#1c251e;--tx:#e8efe9;--mut:#9aab9d;--pri:#5fbf85;--on:#0f1a12;--pri2:#23352a;--bd:#2c3a2f;--red:#ef7b6e;--amb:#e0b25a;--edge:#38865a;--edge2:#0b110c;--sh:rgba(0,0,0,.55);--hl:rgba(255,255,255,.07);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121813;--card:#1c251e;--tx:#e8efe9;--mut:#9aab9d;--pri:#5fbf85;--on:#0f1a12;--pri2:#23352a;--bd:#2c3a2f;--red:#ef7b6e;--amb:#e0b25a;--edge:#38865a;--edge2:#0b110c;--sh:rgba(0,0,0,.55);--hl:rgba(255,255,255,.07);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.hero{background:var(--pri);color:var(--on);border:0}.hero small{opacity:.85}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 2px;text-align:center;font-size:12px;color:var(--tx);cursor:pointer}
.mi b{display:block;font-size:24px;font-weight:400}
.mut{color:var(--mut);font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.badge{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600}
.in{color:var(--pri);font-weight:700}.out{color:var(--red);font-weight:700}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{padding:5px 11px;font-size:13px}.btn.o{background:transparent;color:var(--pri);border:1px solid var(--pri)}
details{margin-bottom:12px}summary{list-style:none}summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0;font:inherit;font-size:11px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}nav button.a{color:var(--pri);font-weight:700}
.today{border-color:var(--pri);background:var(--pri2)}
.chips span{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:1px 9px;margin:2px 3px 0 0;font-size:13px}
a{color:var(--pri)}
body{background:radial-gradient(900px 500px at 15% -5%,var(--pri2),transparent 65%),var(--bg);background-attachment:fixed}
#app{perspective:1100px}
.card{background:linear-gradient(160deg,var(--hl),transparent 45%),var(--card);box-shadow:inset 0 1px 0 var(--hl),0 4px 0 var(--edge2),0 14px 22px -8px var(--sh);transition:transform .2s,box-shadow .2s;animation:pop .45s ease both}
.card:hover{transform:translateY(-2px) rotateX(2deg);box-shadow:inset 0 1px 0 var(--hl),0 6px 0 var(--edge2),0 20px 28px -8px var(--sh)}
.card.today{background:var(--pri2);border-color:var(--pri)}
.card.hero{background:linear-gradient(145deg,var(--pri),var(--edge));border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 5px 0 var(--edge),0 18px 26px -8px var(--sh)}
.btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 var(--edge),0 8px 14px -4px var(--sh);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 0 var(--edge)}
.btn.o{background:var(--card);box-shadow:0 3px 0 var(--bd),0 6px 10px -4px var(--sh)}
.btn.o:active{box-shadow:0 0 0 var(--bd)}
.mi{background:linear-gradient(160deg,var(--hl),transparent 45%),var(--card);box-shadow:inset 0 1px 0 var(--hl),0 5px 0 var(--edge2),0 14px 18px -8px var(--sh);transition:transform .15s,box-shadow .15s}
.mi:hover{transform:translateY(-4px) rotateX(8deg)}
.mi:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge2)}
.mi b{filter:drop-shadow(0 4px 3px var(--sh))}
nav{box-shadow:0 -8px 20px -10px var(--sh)}
nav button.a b{transform:translateY(-2px) scale(1.15);filter:drop-shadow(0 3px 2px var(--sh))}
input,select,textarea{box-shadow:inset 0 2px 4px var(--sh)}
@keyframes pop{from{opacity:0;transform:perspective(600px) rotateX(10deg) translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><nav><div id="nav"></div></nav>
<script>
const $=s=>document.querySelector(s),v=i=>$('#'+i).value.trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp '+Number(n).toLocaleString('id-ID');
const tgl=s=>new Date(s).toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const dn=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const seed=()=>({user:null,
info:[{t:'Kerja bakti bersihkan selokan',c:'Pengumuman',b:'Seluruh warga diharapkan membawa cangkul dan karung. Kumpul pukul 07.00 di balai warga.',d:dn(-1)},{t:'Iuran kebersihan bulan ini',c:'Keuangan',b:'Iuran Rp 20.000 per KK dapat dibayar ke bendahara RT paling lambat tanggal 10.',d:dn(-3)},{t:'Layanan posyandu balita',c:'Kesehatan',b:'Posyandu dibuka setiap Sabtu pertama, pukul 09.00 di rumah Ibu RT.',d:dn(-6)}],
kas:[{k:'Iuran warga bulan ini',m:'in',n:1250000,d:dn(-5)},{k:'Beli lampu jalan',m:'out',n:350000,d:dn(-4)},{k:'Donasi acara 17 Agustus',m:'in',n:500000,d:dn(-10)},{k:'Konsumsi kerja bakti',m:'out',n:180000,d:dn(-2)}],
asp:[{t:'Perbaikan jalan gang 3 yang berlubang',w:'Budi S.',s:'Diproses',v:12},{t:'Tambah tempat sampah di dekat musala',w:'Siti A.',s:'Diterima',v:7}],
saran:[{j:'Saran',t:'Pengeras suara balai warga sebaiknya diperbaiki.',w:'Anonim',d:dn(-2)}],
umkm:[{n:'Warung Bu Tini',o:'Tini',c:'Makanan',d:'Nasi uduk, gorengan, dan es teh. Buka pukul 05.00–14.00.',p:'081234567890'},{n:'Jahit Pak Darto',o:'Darto',c:'Jasa',d:'Menerima jahit baju, permak, dan seragam.',p:'081298765432'}],
ronda:{Senin:['Pak Budi','Pak Joko'],Selasa:['Pak Darto','Pak Anwar'],Rabu:['Pak Slamet'],Kamis:['Pak Hendra','Pak Rudi'],Jumat:['Pak Eko'],Sabtu:['Pak Tono','Pak Agus'],Minggu:['Pak Wahyu']},
giat:[{n:'Kerja bakti bulanan',w:dn(3),l:'Balai warga, 07.00',d:'Membersihkan lingkungan bersama.',j:14,ikut:false},{n:'Pengajian rutin',w:dn(7),l:'Musala Al-Ikhlas, 19.30',d:'Pengajian bersama ustaz tamu.',j:30,ikut:false},{n:'Lomba anak kampung',w:dn(21),l:'Lapangan RT',d:'Lomba balap karung dan makan kerupuk.',j:22,ikut:false}]});
let S;try{S=JSON.parse(localStorage.getItem('kampung')||'null')}catch(e){}S=S||seed();
const save=()=>{try{localStorage.setItem('kampung',JSON.stringify(S))}catch(e){}};
S.users=(S.users||[]).filter(x=>x.user);if(S.users.length&&!S.users.some(x=>x.role=='Admin'))S.users[0].role='Admin';S.notulen=S.notulen||[];S.surat=S.surat||[];S.darurat=S.darurat||[{n:'Ketua RT',p:'081200000001'},{n:'Ketua RW',p:'081200000002'},{n:'Ambulans',p:'119'},{n:'Polisi',p:'110'},{n:'Pemadam Kebakaran',p:'113'},{n:'Puskesmas Terdekat',p:'081200000003'}];S.warga=S.warga||[{n:'Budi Santoso',hp:'081234500001',a:'Gang Mawar No. 1, RT 01/RW 02'},{n:'Siti Aminah',hp:'081234500002',a:'Gang Mawar No. 4, RT 01/RW 02'},{n:'Darto Wijaya',hp:'081234500003',a:'Gang Melati No. 2, RT 02/RW 02'},{n:'Tini Lestari',hp:'081234500004',a:'Gang Melati No. 7, RT 02/RW 02'},{n:'Rizky Pratama',hp:'081234500005',a:'Gang Kenanga No. 3, RT 03/RW 02'}];S.karta=S.karta||[{n:'Turnamen futsal antar RT',w:dn(10),l:'Lapangan RT, 15.00',d:'Pendaftaran terbuka untuk tim pemuda tiap RT.',p:['Rizky','Dimas']},{n:'Bersih sungai bersama pemuda',w:dn(14),l:'Tepi sungai, 06.30',d:'Aksi bersih sungai dan penanaman pohon.',p:['Putri']},{n:'Rapat pengurus Karang Taruna',w:dn(5),l:'Balai warga, 19.30',d:'Membahas program pemuda bulan depan.',p:[]}];S.user=S.user&&S.users.find(x=>x.user==S.user.user)||null;
let page='home';

const isP=()=>true;
const FULL=['home','menu','info','asp','saran','umkm','ronda','giat','notulen','rekap','karta','darurat','surat'];
const ACC={Warga:[...FULL,'kas','warga'],'Karang Taruna':[...FULL,'kas','warga','iuran'],Admin:[...FULL,'warga','akun','iuran'],Sekretaris:[...FULL,'warga','iuran'],'Ketua RW':['home','menu','info','rekap','warga','iuran','darurat','surat'],'Ketua RT':['home','menu','info','rekap','warga','iuran','darurat','surat'],Bendahara:['home','menu','info','kas','iuran','rekap','darurat']};
const BASE=[...FULL,'kas','warga','pengaturan'],EXTRA={Admin:['akun','iuran'],Sekretaris:['iuran'],'Ketua RT':['iuran'],'Ketua RW':['iuran'],Bendahara:['iuran'],'Karang Taruna':['iuran']};
const can=p=>BASE.includes(p)||(EXTRA[S.user.role]||[]).includes(p);
const EDR={info:['Admin','Sekretaris'],asp:'*',saran:'*',umkm:['Admin','Sekretaris'],ronda:['Admin','Sekretaris'],giat:['Admin','Sekretaris'],kas:['Bendahara'],notulen:['Admin','Sekretaris'],karta:['Admin','Sekretaris','Karang Taruna'],warga:['Admin','Sekretaris'],surat:'*',darurat:['Admin','Sekretaris']};
const canEd=p=>{const r=EDR[p];return r=='*'||(r||[]).includes(S.user.role)};
const NV=[['home','🏠','Beranda'],['info','📢','Info'],['kas','💰','Kas'],['giat','📅','Kegiatan'],['menu','☰','Menu']];
const T={home:'Beranda',info:'Informasi',kas:'Keuangan',asp:'Aspirasi',saran:'Kritik dan Saran',umkm:'UMKM Warga',ronda:'Jadwal Ronda',giat:'Kegiatan',menu:'Semua Menu',rekap:'Rekap Laporan',notulen:'Catatan Sekretaris',karta:'Karang Taruna',warga:'Data Warga',akun:'Kelola Akun',iuran:'Iuran Warga',darurat:'Nomor Penting',surat:'Surat Pengantar',pengaturan:'Pengaturan'};
const M=[['info','📢','Informasi'],['kas','💰','Keuangan'],['asp','🗣️','Aspirasi'],['saran','💬','Kritik dan Saran'],['umkm','🛍️','UMKM'],['ronda','🔦','Jadwal Ronda'],['giat','📅','Kegiatan'],['darurat','🚨','Nomor Penting'],['surat','📄','Surat Pengantar'],['iuran','💳','Iuran Warga'],['akun','🔐','Kelola Akun'],['warga','👥','Data Warga'],['karta','🎉','Karang Taruna'],['notulen','📝','Catatan'],['rekap','📊','Rekap Laporan'],['pengaturan','⚙️','Pengaturan']];
const setHash=h=>{try{history.replaceState(null,'','#'+h)}catch(e){}};
const go=p=>{if(location.hash.slice(1)==p){page=p;render();scrollTo(0,0)}else location.hash=p};
addEventListener('hashchange',()=>{const h=location.hash.slice(1);page=T[h]?h:'home';render();scrollTo(0,0)});
const sum=m=>S.kas.filter(x=>x.m==m).reduce((a,x)=>a+x.n,0);
const saldo=()=>sum('in')-sum('out');
const add=(k,o)=>{S[k].unshift(o);save();render()};
const det=(label,body)=>!canEd(page)?'':`<details ${isP()?'':'open'}><summary><span class="btn">${label}</span></summary><div class="card">${body}</div></details>`;

function viewHomeWarga(){return `<div class="card hero"><small>Selamat datang,</small><h1 style="margin:2px 0">${esc(S.user.nama)}</h1><small>RT ${esc(S.user.rt)} / RW ${esc(S.user.rw)} · ${esc(S.user.alamat)}</small></div><div class="card"><b>Suara Anda penting</b><div class="mut">Sampaikan kritik atau saran untuk kemajuan kampung kita.</div><p style="margin:10px 0 0"><button class="btn" onclick="go('saran')">Kirim kritik dan saran</button> <button class="btn o s" onclick="logout()">Keluar</button></p></div>`}
function viewHome(){
 const h=HARI[new Date().getDay()],r=S.ronda[h]||[];
 return `<div class="card hero"><small>Selamat datang, ${esc(S.user.role)}</small><h1 style="margin:2px 0">${esc(S.user.nama)}</h1><small>RT ${esc(S.user.rt)} / RW ${esc(S.user.rw)} · ${esc(S.user.alamat)}</small>${can('kas')?`<div style="margin-top:10px"><small>Saldo kas kampung</small><div style="font-size:24px;font-weight:700">${rp(saldo())}</div></div>`:''}</div>
 <div class="grid">${M.filter(m=>can(m[0])).map(m=>`<div class="mi" onclick="go('${m[0]}')"><b>${m[1]}</b>${m[2]}</div>`).join('')}</div>
 ${can('ronda')?`<h2>Ronda malam ini (${h})</h2><div class="card">${r.length?r.map(esc).join(', '):'Belum ada petugas'}</div>`:''}
 ${can('giat')?'<h2>Kegiatan terdekat</h2>':''}${(can('giat')?S.giat:[]).slice(0,2).map(g=>`<div class="card"><b>${esc(g.n)}</b><div class="mut">${tgl(g.w)} · ${esc(g.l)}</div></div>`).join('')}
 ${can('info')?'<h2>Informasi terbaru</h2>':''}${(can('info')?S.info:[]).slice(0,2).map(i=>`<div class="card"><span class="badge">${esc(i.c)}</span> <b>${esc(i.t)}</b><div class="mut">${tgl(i.d)}</div></div>`).join('')}`}

function viewMenu(){return `<div class="grid">${M.filter(m=>can(m[0])).map(m=>`<div class="mi" onclick="go('${m[0]}')"><b>${m[1]}</b>${m[2]}</div>`).join('')}</div>
 <div class="card" style="margin-top:14px"><b>${esc(S.user.nama)}</b> <span class="badge">${esc(S.user.role)}</span><div class="mut">@${esc(S.user.user)}<br>NIK ${esc(S.user.nik.slice(0,4)+'********'+S.user.nik.slice(-4))} · HP ${esc(S.user.hp)}<br>RT ${esc(S.user.rt)} / RW ${esc(S.user.rw)} · ${esc(S.user.alamat)}</div><p><button class="btn o s" onclick="logout()">Keluar</button></p></div>`}

function viewInfo(){return viewInfo0()+viewSaranFeed()}
function viewSaranFeed(){return `<h2>Kritik dan Saran Warga</h2>${can('saran')?`<p style="margin:0 0 8px"><button class="btn o s" onclick="go('saran')">+ Kirim kritik dan saran</button></p>`:''}`+(S.saran.length?S.saran.slice(0,10).map(s=>`<div class="card"><div class="row"><span class="badge">${esc(s.j)}</span><span class="mut">${tgl(s.d)}</span></div><div>${esc(s.t)}</div><div class="mut">— ${esc(s.w)}</div></div>`).join(''):'<div class="card mut">Belum ada kritik dan saran.</div>')}
function viewInfo0(){return det('+ Tambah informasi',`<input id="it" placeholder="Judul"><select id="ic"><option>Pengumuman</option><option>Keuangan</option><option>Kesehatan</option><option>Keamanan</option></select><textarea id="ib" rows="3" placeholder="Isi informasi"></textarea><button class="btn" onclick="addInfo()">Terbitkan</button>`)+
 S.info.map(i=>`<div class="card"><div class="row"><span class="badge">${esc(i.c)}</span><span class="mut">${tgl(i.d)}</span></div><b>${esc(i.t)}</b><div>${esc(i.b)}</div></div>`).join('')}

const kg=x=>x.g||(x.m=='out'?'Keluar':/iuran/i.test(x.k)?'Iuran':/donasi|sumbang/i.test(x.k)?'Sumbangan':'Masuk');
const sg=g=>S.kas.filter(x=>kg(x)==g).reduce((a,x)=>a+x.n,0);
const mc=(l,n,c)=>`<div class="card" style="margin:0"><div class="mut">${l}</div><b class="${c}">${rp(n)}</b></div>`;
function viewKas(){if(0)return `<div class="card hero"><small>Total saldo kas akhir</small><div style="font-size:28px;font-weight:700">${rp(saldo())}</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">${mc('Iuran',sg('Iuran'),'in')}${mc('Sumbangan',sg('Sumbangan'),'in')}${mc('Saldo masuk',sum('in'),'in')}${mc('Saldo keluar',sum('out'),'out')}</div><p class="mut">Rincian transaksi hanya dikelola dan dilihat oleh Bendahara.</p>`;return `${can('iuran')?`<button class="btn" style="width:100%;margin-bottom:10px" onclick="go('iuran')">💳 Iuran Warga: sudah dan belum bayar</button>`:''}<div class="card hero"><small>Total saldo</small><div style="font-size:28px;font-weight:700">${rp(saldo())}</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">${mc('Iuran',sg('Iuran'),'in')}${mc('Sumbangan',sg('Sumbangan'),'in')}${mc('Saldo masuk',sum('in'),'in')}${mc('Saldo keluar',sum('out'),'out')}</div>`+
 det('+ Catat transaksi',`<input id="kk" placeholder="Keterangan"><select id="km"><option value="Iuran">Iuran (masuk)</option><option value="Sumbangan">Sumbangan (masuk)</option><option value="Masuk">Saldo masuk lainnya</option><option value="Keluar">Saldo keluar</option></select><input id="kn" type="number" inputmode="numeric" placeholder="Jumlah (Rp)"><button class="btn" onclick="addKas()">Simpan</button>`)+
 S.kas.map(x=>`<div class="card row"><div><b>${esc(x.k)}</b><div class="mut"><span class="badge">${kg(x)}</span> ${tgl(x.d)}</div></div><span class="${x.m=='in'?'in':'out'}">${x.m=='in'?'+':'−'}${rp(x.n)}</span></div>`).join('')}

function viewAsp(){return det('+ Sampaikan aspirasi',`<input id="at" placeholder="Aspirasi atau usulan Anda"><button class="btn" onclick="addAsp()">Kirim</button>`)+
 S.asp.map((a,i)=>`<div class="card"><div class="row"><b>${esc(a.t)}</b><span class="badge">${esc(a.s)}</span></div><div class="mut">Oleh ${esc(a.w)}</div>${isP()?`<p style="margin:8px 0 0"><button class="btn o s" onclick="dukung(${i})">👍 Dukung (${a.v})</button> ${canMng()?`<button class="btn s" onclick="status(${i})">Ubah status</button>`:''}</p>`:`<div class="mut" style="margin-top:6px">👍 ${a.v} dukungan</div>`}</div>`).join('')}

function viewSaran(){return det('+ Tulis kritik atau saran',`<select id="sj"><option>Saran</option><option>Kritik</option><option>Pengaduan</option></select><textarea id="st" rows="3" placeholder="Tulis di sini"></textarea><label class="mut"><input type="checkbox" id="sa" style="width:auto"> Kirim sebagai anonim</label><br><button class="btn" onclick="addSaran()">Kirim</button>`)+
 S.saran.map(s=>`<div class="card"><div class="row"><span class="badge">${esc(s.j)}</span><span class="mut">${tgl(s.d)}</span></div><div>${esc(s.t)}</div><div class="mut">— ${esc(s.w)}</div></div>`).join('')}

function viewUmkm(){return det('+ Daftarkan usaha',`<input id="un" placeholder="Nama usaha"><input id="uc" placeholder="Kategori (mis. Makanan, Jasa)"><textarea id="ud" rows="2" placeholder="Deskripsi singkat"></textarea><input id="up" type="tel" placeholder="Nomor WhatsApp"><button class="btn" onclick="addUmkm()">Daftarkan</button>`)+
